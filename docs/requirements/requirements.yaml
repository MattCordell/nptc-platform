  title: "Properties marked filterable SHOULD have a supporting index created automatically"
  status: planned
  notes: "ADR-0012 (issue #136) fixes the index shapes (GIN jsonb_path_ops for coded properties, expression indexes for string/url and decimal/positiveInt) as partial indexes named ix_propval_p{index_seq}_{slot}, and defers the DDL executor's topology to #54 as an explicit open question with two ruled-out candidates. Stays planned: no executor exists yet."
