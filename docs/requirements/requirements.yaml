- id: "FR-70"
  priority: MUST
  phase: p0
  title: "A command-line transform that reads the published SPIA workbook and produces either a validated import dataset or a detailed defect report"
  status: implemented
  notes: "CLI entrypoint, --report-only default and the report writer land with P0-1/#23; the workbook reader and Appendix A.1-A.3 cell defect detection land with P0-2/#24; import dataset emission (--emit-dataset --release-name, import-dataset.json) lands with P0-9/#31 (ADR-0010)"
- id: "FR-71"
  priority: MUST
  phase: p0
  title: "The transform classifies every finding into one of three bands, and the band determines behaviour"
  status: implemented
  notes: "Band registry, per-finding band assignment, the blocking exit code and report band columns/counts land with P0-3/#25; automatic application of the auto-correctable band's corrections (--emit-dataset) lands with P0-9/#31"
- id: "FR-72"
  priority: MUST
  phase: p0
  title: "The defect report is machine-readable (JSON or CSV) and human-readable"
  status: implemented
  notes: "Grouped defect report lands with P0-8/#30 (ADR-0009): findings are grouped Band -> FindingCode (BAND_REPORT_ORDER, blocking bands first, never Band's own declaration order), report.json's flat findings list is replaced by defect_classes (schema_version 7) carrying band/blocks_import/action/finding_count once per group, Finding.location becomes a structured CellRef (nptc_transform.cellref) replacing the opaque Sheet!Cell string end-to-end, and actions.py's ACTION_BY_CODE states the required action for every FindingCode. No CSV - report.json plus report.md stay the only two output files."
- id: "FR-73"
  priority: MUST
  phase: p0
  title: "The transform is idempotent and re-runnable"
  status: implemented
  notes: "Determinism/idempotency harness and the no-clock/no-absolute-path report writer land with P0-1/#23; the guarantee is proven against real, transformed content once import dataset emission lands with P0-9/#31 (a committed real 50-row excerpt fixture, transform/tests/fixtures/spia-requesting-sample.xlsx)"
- id: "FR-74"
  priority: MUST
  phase: p0
  title: "Every code in the source is validated against both editions during transform, using the same validation engine as FR-45"
  status: in-progress
  notes: "nptc-transform run --check-terminology validates every code cell against SNOMED CT-AU and International through nptc_shared.terminology.sweep - the engine the backend's FR-45 sweep will use, not a second one (#27). The rest of FR-45's check table (FSN drift, preferred-term drift, inactivation reason/historical association pairing) lands with P0-6/#28."
- id: "FR-75"
  priority: SHOULD
  phase: p0
  title: "The transform reports semantic mismatches between the RCPA preferred term and the bound SNOMED FSN as warnings for editorial review"
  status: implemented
  notes: "nptc-transform's TERM_SPECIMEN_NOT_MODELLED/TERM_SPECIMEN_DIFFERS/TERM_TIMING_NOT_MODELLED heuristics land with P0-7/#29 (ADR-0008): a hand-typed + server-augmented specimen table (nptc_transform.specimen_table) checked against each bound concept's own Has specimen (116686009) attribute value via chunked ECL set-membership (TerminologySweep.codes_without_attribute/codes_with_attribute_value/describe), never a per-row $lookup. All three codes are Band.INFORMATIONAL - candidates for editorial review (H-03), not confirmed defects."
- id: "FR-76"
  priority: MUST
  phase: p0
  title: "The seeded data MUST be imported as a synthetic baseline release representing the state at seeding"
  status: in-progress
  notes: "The transform side lands with P0-9/#31 (ADR-0010): --emit-dataset --release-name YYYY-MM writes import-dataset.json's baseline_release block, a machine-generated release standing in for a curation cycle that never happened, so the first genuinely new release produces a meaningful diff (FR-60). Not implemented: the backend Release table and initial data load that actually import the dataset - backend/src/nptc/{catalogue,releases,db} are bare scaffolding and backend/migrations/ is empty until P1-1, so this stays in-progress rather than implemented."
- id: "FR-77"
  priority: SHOULD
  phase: p1
  title: "The design MUST accommodate the addition of new datatypes to the registry, not only new properties, without a rebuild"
  status: implemented
  notes: "Issue #53 implements ADR-0013's design: a ten-member DatatypeHandler Protocol in backend/src/nptc/registry/handlers.py (the ADR's eleventh member, sort_key, is dropped per its own open question 5 - no caller needs it), five builtin handlers built via explicit build_builtin_handlers(deps) construction under backend/src/nptc/registry/datatypes/, and the named enforcement mechanism, backend/tests/test_datatype_dispatch.py, a pure-ast guard banning datatype dispatch outside registry/datatypes/. backend/tests/test_synthetic_datatype.py proves extensibility with a wholly synthetic `duration` datatype exercised through save/validate/filter/export via only a new handler. #51/#52/#54 (storage, schema derivation, indexing) are still open, so the proof runs at the contract level, not against a live database or export/search layer."
- id: "FR-78"
  priority: MUST
  phase: p4
  title: "Administrators MUST be able to generate an ad hoc export of the current working state, outside the release cycle, in any configured format"
  status: planned
  notes: ""
- id: "FR-79"
  priority: SHOULD
  phase: p0
  title: "The transform SHOULD detect probable misspellings in designations"
  status: in-progress
  notes: "nptc-transform's PROBABLE_MISSPELLING/INCONSISTENT_SPELLING heuristics (intra-entry near-match, cross-entry corpus frequency, and a served-designation authority whitelist standing in for the PRD's domain word list) land with P0-7/#29, over nptc_shared.similarity (#29, ADR-0007). The PRD's own second half - the same check available on save in the application (FR-36) - is deferred to a follow-up PR against the backend."
- id: "FR-80"
  priority: MUST
  phase: p2
  title: "The Observer role MUST have no write capability of any kind"
  status: in-progress
  notes: "Issue #44 (ADR-0019): proven at the permission-data level - backend/tests/test_permissions_data.py::test_observer_has_no_write_permission_at_all asserts ROLE_PERMISSIONS[OBSERVER] & WRITE_PERMISSIONS is empty, stronger than any per-endpoint test since it fails the day a single write permission is added to Observer. The FR text's own 'negative authorisation test for every write endpoint' is not yet fully satisfiable: backend/src/nptc/api/ has zero routes today. backend/tests/test_authz_inventory.py's route-table inventory (with a positive control) is what will hold every future write endpoint to this once #142/#143 land the app; backend/tests/authz_support.py's assert_permission_refused and authz_app_support.py's HTTP-level harness (401-vs-403, no-leakage) are ready for those endpoints to use immediately."
- id: "FR-81"
  priority: MUST
  phase: p2
  title: "The boundary between Reviewer and Administrator MUST be enforced server-side per permission"
  status: in-progress
  notes: "Issue #44 (ADR-0019): backend/tests/test_permissions_data.py::test_administrator_only_permissions_are_refused_to_reviewer and test_administrator_only_covers_every_prd_section_4_5_withheld_capability assert every PRD 4.5 withheld capability (plus the non-obvious seventh, submission.withdraw.any) is Administrator-only and absent from Reviewer's set. Per-endpoint negative tests are owed once #142/#143 land routes (see FR-80's note - same inventory/harness)."
- id: "FR-82"
  priority: MUST
  phase: p1
  title: "The platform MUST store fsn and au_preferred_term exactly as the terminology server returns them, with the semantic tag intact on the FSN"
  status: implemented
  notes: "Issue #48: code_binding.fsn/au_preferred_term carry no @validates hook and no CHECK beyond not-blank - unlike designation.term/catalogue_entry.preferred_term, neither is cleaned, trimmed or otherwise transformed at rest. backend/tests/test_catalogue_bindings.py asserts this structurally (no reference to clean_term/normalise_for_comparison/strip_semantic_tag in nptc.db.models.code_binding) and round-trips the 391483001 / 'Microscopy (acid fast bacilli) (procedure)' fixture byte for byte with the tag intact."
- id: "FR-83"
  priority: MUST
  phase: p1
  title: "Semantic tag removal happens only in the export renderer, never in storage or in validation"
  status: implemented
  notes: "Issue #48: nptc.exports.semantic_tag.render_display_term is the one call site, landed early (ahead of the P4 export renderers) so the guarantee is structural from the moment a served FSN first has anywhere to live. It wraps nptc_shared.terminology.strip_semantic_tag with FR-83's two defensive assertions: the input must end with a parenthesised group or the export fails loudly (NotAServedFSNError) rather than publish a non-served value, and the result must be non-empty (EmptyDisplayTermError). backend/tests/test_catalogue_bindings.py's ast walk covers backend/src, transform/src and shared/src and asserts the strip is referenced from no module outside nptc.exports, except two pre-existing FR-97 seeding-reconciliation call sites (ADR-0006, transform/src/nptc_transform/designation_check.py and shared/src/nptc_shared/terminology/sweep.py) and the shared package's own re-export; backend/tests/test_semantic_tag_render.py covers the 391483001 fixture (NFR-38 test 11) and both fail-loud cases (test 12)."
- id: "FR-84"
  priority: MUST
  phase: p1
  title: "Every code binding MUST be subsumed by 71388002 |Procedure (procedure)|"
  status: implemented
  notes: "ceil(N/chunk_size) ValueSet/$expand calls of (chunk) MINUS <<71388002 per edition in TerminologySweep - chunked the same as the status pass, not one request for the whole catalogue, since a single disjunction is itself too large to send at the PRD's 20,000-code ceiling (~340KB of ECL; ADR-0005's 2026-08-07 amendment). Reported by the transform as OUT_OF_SCOPE_HIERARCHY in the blocking data-defect band (#27). NFR-38 test 13's call-count-not-per-code assertion is shared/tests/test_terminology_sweep.py. The backend's own enforcement at entry time lands with P1."
- id: "FR-85"
  priority: MUST
  phase: p1
  title: "Length MUST be computed from the preferred term and MUST NOT be storable or editable (FR-24)"
  status: in-progress
  notes: "Issue #47: CatalogueEntry.length (backend/src/nptc/db/models/catalogue_entry.py) is the field FR-85 is actually about - PRD §6.5 defines Length as the RCPA/catalogue preferred term's character count, and ADR-0022 establishes that term never lives on a designation row. It is a read-only @property computed by nptc.catalogue.term_hygiene.preferred_term_length (len(normalise_for_comparison(preferred_term))), with catalogue_entry carrying no length column at all. Designation.length applies the same computation to a designation's own term (a synonym or non-en-AU variant) for the same reason, but is not itself the published figure. backend/tests/test_catalogue_designations.py covers the PRD §6.5 migration case directly on CatalogueEntry.length: a trailing non-breaking space shifts the published length once it collapses to nothing after cleaning. Remains in-progress: 'continues to be published, for continuity' needs the export/presentation layer (#63) and the configurable-maximum/distribution-report follow-on is #152 (FR-86/FR-87)."
- id: "FR-86"
  priority: SHOULD
  phase: p1
  title: "The platform SHOULD support a configurable maximum preferred-term length"
  status: planned
