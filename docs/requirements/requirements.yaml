# Requirements register (Foundation issue F-5, FR-05 of the delivery plan).
#
# One entry per FR-nn/NFR-nn in docs/prd/NPTC-Catalogue-Platform-PRD.md. Extracted
# once by a throwaway script (title = the requirement's own first sentence, so the
# register quotes the PRD rather than paraphrasing it) and hand-maintained from
# here on - see CONTRIBUTING.md and scripts/traceability_check.py.
#
# Fields:
#   id       FR-nn / NFR-nn, stable, matches the PRD exactly.
#   priority MUST / SHOULD / MAY, the PRD's own RFC-2119 scheduling band.
#   phase    foundation / p0 / p1 / p2 / p3 / p4 / p5 / governance - descriptive
#            grouping only (where this requirement conceptually belongs in the
#            delivery narrative). It drives no check in traceability_check.py and
#            need not match the phase of the GitHub issue that actually delivers
#            the requirement - that issue's own "## Requirement IDs" section is
#            the authority on what delivers what.
#   title    Short label, quoted from the PRD.
#   status   planned / in-progress / implemented / deferred / n-a.
#   notes    Free text - deferral rationale, links to an open issue, etc.
#   evidence Optional. A repo-relative path (optionally with a #fragment, e.g.
#            ".github/workflows/ci.yml#transform-offline") demonstrating the
#            requirement without a pytest test - for infrastructure/process
#            requirements with no plausible test (see ADR-0002). Mutually
#            exclusive with a test marker.
#
# Moving a requirement to `implemented` requires either a test carrying
# @pytest.mark.req("<id>") or an evidence: path; traceability_check.py enforces
# this in CI (including that an evidence: path exists on disk), along with:
# every ID here is used at least once in a test and vice versa. Whether a MUST
# requirement has a corresponding GitHub issue is a manual review concern, not
# a CI gate.

