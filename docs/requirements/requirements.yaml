- id: "FR-88"
  priority: MUST
  phase: p1
  title: "Specimen MUST be a coded property with cardinality 0..*, bound to a value set rooted at 123038009, replacing the semicolon-delimited string"
  status: planned
  notes: "The transform's seeding-time treatment (P0-9/#31): a Specimen cell is split on ';' into 0..* provisional values; each is coded only on an exact match against nptc_transform.specimen_table.SPECIMEN_TABLE's surface forms (SPECIMEN_VALUE_UNMAPPED, informational, otherwise) - the migrate-verbatim-as-provisional-codes precedent FR-92 also follows. The governed value set itself, and its enforcement, belong to the backend registry (P1) and remain planned."
- id: "FR-89"
  priority: MUST
  phase: p1
  title: "The value 'Any' MUST NOT be represented as a specimen code"
  status: planned
  notes: "The transform's seeding-time treatment (P0-9/#31): 'Any' resolves to specimen_unconstrained: true and zero specimen values in import-dataset.json, never a specimen code (SPECIMEN_UNCONSTRAINED_RESOLVED, auto-correctable). Enforcing this at the backend registry level (P1) remains planned."
- id: "FR-90"
  priority: MUST
  phase: p1
  title: "Discipline and Subgroup MUST each be implemented as a governed local code system owned by RCPA-QAP"
  status: in-progress
  notes: "Issue #56: local_code_system/local_code tables, administrator-only management (Permission.REGISTRY_MANAGE) through the same audit/changelog discipline as every other content change. Three of the four bullets are implemented; the fourth - version history tied to catalogue releases - is deferred to #199, since release does not exist yet (nptc.releases is a P4 stub). status/deprecated_at plus the NFR-08 audit trail make past state reconstructable in the meantime. The transform's own seeding-time treatment (P0-9/#31, COMPOUND_VALUE_SPLIT) remains the pre-existing note about the source cell shape."
- id: "FR-91"
  priority: SHOULD
  phase: p1
  title: "A published non-authoritative map from the local Discipline code system to SNOMED CT concepts, for consumers who want a SNOMED view"
  status: implemented
  notes: "Issue #56: the local_code_snomed_map table, seeded (migration 0011) from PRD SS6.6's own verification table - Chemical pathology/Haematology/Immunopathology at exact strength, Microbiology mapped twice at ambiguous strength, and deliberately no row for Molecular or Serology. Never a code_binding structurally (no entry_id, no FK to catalogue_entry) - backend/tests/test_catalogue_local_codes.py's AST guard pins that the sweep/binding modules never reference LocalCodeSnomedMap."
- id: "FR-92"
  priority: SHOULD
  phase: p1
  title: "Subgroup migration MUST reconcile inconsistent classification axes and pluralisation before the code system is populated"
  status: planned
  notes: "Issue #56 lands the storage mechanism this requirement needs (local_code.provisional, seeded true with no definition for a value migrated verbatim) but does not itself reconcile the Subgroup axes or pluralisation - that is RCPA-QAP's editorial decision, still outstanding. The subgroup code system is seeded (migration 0011) with no codes at all, so no code exists yet to be provisional. Out of scope for the transform's seeding-time treatment (P0-9/#31): compound-value splitting (see FR-90's note) migrates each hand-typed value verbatim as a provisional property value, and does not itself reconcile axis or pluralisation inconsistencies."
- id: "FR-93"
  priority: MUST
