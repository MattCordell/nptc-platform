- id: "NFR-22"
  priority: MUST
  phase: p1
  title: "Parameterised queries throughout"
  status: in-progress
  notes: "backend/tests/test_sql_parameterisation.py (issue #33, ADR-0011) statically enforces that no SQL text reaching text()/.execute()/.exec_driver_sql()/op.execute() is built from an f-string, %/+ concatenation, or .format(), and that no migration ever grants ALL on the audit_event table - with its own positive control proving the walker actually matches something rather than silently rotting into a check that always passes. Issue #142 adds the first raw statement in the codebase written for the planner rather than the ORM (nptc.catalogue.search._SEARCH_SQL, the trigram search): a module-level literal with every value bound, so it satisfies the guard by construction. Stays in-progress: the half of NFR-22 carrying the real risk is FR-13's JSONB filtering against registry-validated keys, and the registry now exists (#51/#53) while the filter surface (#138) does not."
