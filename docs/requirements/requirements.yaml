  title: "Every artefact that publishes a SNOMED label MUST state explicitly which designation it carries and whether the tag is stripped"
  status: planned
  notes: ""
- id: "FR-99"
  priority: SHOULD
  phase: p1
  title: "Where a binding is subsumed by <<71388002 but its semantic tag is not (procedure), raise a warning, not an error"
  status: implemented
  notes: "snomed.semantic_tag reads the FSN the bulk expansion already returned, so the check costs no extra requests; reported as UNEXPECTED_SEMANTIC_TAG in the non-blocking informational band, never alongside an FR-84 violation for the same concept (#27)."
- id: "FR-100"
  priority: MUST
  phase: p0
  title: "A row that carries a 'RCPA Preferred term' value but resolves no code binding is flagged MISSING_CODE_BINDING (data-defect) and is never seeded into the import dataset"
  status: implemented
  notes: "Mirror of FR-70/FR-71's MISSING_PREFERRED_TERM for the opposite column (#132); unlike that code, a code-less row is judged more likely to be layout (a heading, a continuation line) than a genuine entry awaiting a code, so build_dataset omits the row entirely rather than seeding it with an empty code_bindings list."
- id: "NFR-01"
  priority: MUST
  phase: p1
  title: "Authentication is delegated to a Keycloak instance deployed as part of the stack"
  status: planned
  notes: ""
- id: "NFR-02"
  priority: MUST
  phase: p1
  title: "Keycloak launches with its local user database enabled and external federation switched off"
  status: in-progress
  notes: "deploy/keycloak/realm/nptc-realm.json (issue #40, ADR-0014) declares identityProviders: [] and no userFederationProviders, with registrationAllowed/resetPasswordAllowed/loginWithEmailAllowed all true - asserted by backend/tests/test_keycloak_realm.py's test_no_external_identity_federation and test_local_registration_is_enabled. Stays in-progress: this is realm-as-code only, no login flow exercises it until #41."
- id: "NFR-03"
  priority: MUST
  phase: p1
  title: "Keycloak realm configuration MUST be managed as code and MUST NOT be configured by hand through the admin console"
  status: implemented
  evidence: "deploy/keycloak/realm/nptc-realm.json"
  notes: "Issue #40 (ADR-0014): deploy/compose.yml's keycloak service runs start-dev --import-realm against the committed realm file, bind-mounted read-only - no console step in any runbook. backend/tests/test_keycloak_realm.py's offline group (marked NFR-03) asserts the compose bind mount resolves to the file under test and the realm imports --import-realm on startup; its integration group starts the pinned image for real and asserts the discovery document and admin API reflect the imported realm. The artefact (the realm file itself) is as much the evidence as the tests (ADR-0002)."
- id: "NFR-04"
  priority: MUST
  phase: p1
  title: "Application data MUST NEVER be keyed on the identity provider's subject claim"
  status: implemented
  notes: >-
    app_user/user_identity (issue #42, ADR-0015) key every reference on an internal UUID.
    nptc.auth.identity.UserRef is the serialisation boundary that keeps the UUID from
    escaping any response/export; a follow-on issue must extend that assertion across
    every response model and export renderer once they exist.
- id: "NFR-05"
  priority: MUST
  phase: p1
  title: "Automatic linking of an external identity to an existing account is permitted only where the issuer is explicitly trusted and asserts email_verified"
  status: implemented
  notes: "nptc.auth.linking.may_auto_link (issue #42, ADR-0015); NPTC_TRUSTED_ISSUERS is fail-closed (empty by default)."
- id: "NFR-06"
  priority: SHOULD
  phase: p1
  title: "Multi-factor authentication (TOTP) MUST be available and SHOULD be mandatory for the administrator role"
  status: in-progress
  notes: "The 'available' half only (issue #43, ADR-0016): deploy/keycloak/realm/nptc-realm.json's otpPolicyType: totp plus an explicit requiredActions CONFIGURE_TOTP entry, asserted offline (backend/tests/test_keycloak_realm.py::test_otp_policy_is_totp_with_pinned_parameters, test_configure_totp_required_action_is_enabled) and against a real container's admin API (test_keycloak_imports_the_realm_and_serves_discovery). Mandatory-for-administrators is deferred to #44, which is where an administrator role first exists to make it mandatory for."
- id: "NFR-07"
  priority: MUST
  phase: p1
  title: "All tokens validated server-side on every request: signature against the realm's JWKS, issuer, audience, and expiry"
  status: implemented
  notes: "nptc.auth.tokens.TokenVerifier (issue #43, ADR-0016): signature (JWKS via nptc.auth.jwks.SigningKeys, an RS256 allowlist checked before any key lookup), issuer and audience (nptc.auth.discovery plus jwt.decode), and expiry (leeway=0.0) all checked before an OidcIdentityClaims is built; nptc.auth.authentication.authenticate joins a verified token to #42's resolve_user_for_claims. test_token_verification_guard.py is the AST guard proving no code path trusts a claim before the signature; test_auth_token_verification.py/test_auth_jwks_cache.py/test_auth_discovery.py are offline; test_auth_authenticate.py and test_keycloak_jwt.py are integration, the latter against a real Keycloak-minted token."
- id: "NFR-08"
  priority: MUST
  phase: p1
  title: "A single append-only audit log capturing every state-changing operation"
  status: in-progress
  notes: "The audit_event table itself lands with issue #33 (nptc.db.models.audit, ADR-0011); nptc.audit.writer.append_audit_event (issue #36, ADR-0017) is the sole write path, using the database clock (clock_timestamp()) for occurred_at, never the client. Issue #37/ADR-0018 adds nptc.audit.recording.record_change/record_snapshot_change as the diff-aware entry point domain code should call instead of hand-building before/after: it diffs a mapped instance's own SQLAlchemy attribute history (or a pair of snapshots) via nptc.audit.diffing, and raises AuditNoOpError on an empty diff rather than silently emitting nothing. nptc.audit.policy's model-coverage guard (test_audit_redaction.py) is what makes a future write path (#46+) unable to bypass field classification - every mapped model must resolve a policy or declare an explicit exemption. close_account is the first real consumer of record_change. Issue #163 adds the nptc.auth.identity emit sites the UserIdentity policy was built ahead of: user_identity.created on first login and the auto-link path, user_identity.refreshed on a repeat login that actually changes email/email_verified, and user_identity.deleted (one event per row, via an ORM per-row delete rather than a bulk DELETE, so record_change can read each row's attribute history) on close_account. Stays in-progress: route-level endpoint enumeration is still noted on issue #37 as landing with the API layer (#142/#149/#150), since there is no APIRouter anywhere in backend/src yet."
- id: "NFR-09"
  priority: MUST
  phase: p1
  title: "Append-only MUST be enforced at the database privilege level"
  status: implemented
  notes: "The audit_event table's INSERT/SELECT-only grant and its UPDATE/DELETE/TRUNCATE refusal tests land with issue #33 (backend/tests/test_db_audit_privileges.py, marked NFR-09; ADR-0011). Issue #35's post-round-trip re-assertion criterion is covered by backend/tests/test_db_round_trip.py's test_app_role_is_still_refused_*_after_round_trip tests. Moves to implemented with issue #36 (ADR-0017): the NFR-10 hash chain now makes the log genuinely tamper-evident against a table owner, not merely refusal-enforced against the application role."
- id: "NFR-10"
  priority: SHOULD
  phase: p1
  title: "Each entry includes a SHA-256 hash over its own content plus the previous entry's hash, forming a chain"
  status: implemented
  notes: "nptc.audit.hashing (issue #36, ADR-0017): prev_hash/entry_hash columns (migration 0004_audit_event_hash_chain.py), a canonical-JSON SHA-256 digest over every audit_event column except entry_hash and sequence, and nptc.audit.verification.verify_chain, which streams the chain in sequence order and reports the first prev_hash/entry_hash mismatch. backend/tests/test_audit_hashing.py is offline; backend/tests/test_audit_chain.py and backend/tests/test_audit_tamper_detection.py are integration, covering per-column tamper, deletion, re-order, awkward JSONB round-trips and concurrent-append serialisation via pg_advisory_xact_lock. The operator CLI wrapping verify_chain (scripts/verify_audit_chain.py, exit codes, --expected-head-hash/--expected-record-count anchoring against tail truncation) landed with #38 - see backend/tests/test_verify_audit_chain_cli.py and docs/operations/runbooks/verify-audit-chain.md."
- id: "NFR-11"
  priority: MUST
  phase: p1
  title: "Authentication events (login, failure, lockout, MFA enrolment) are logged by Keycloak in its own event store"
  status: in-progress
  notes: "deploy/keycloak/realm/nptc-realm.json (issue #40, ADR-0014) sets eventsEnabled/adminEventsEnabled/adminEventsDetailsEnabled: true with a 7-day eventsExpiration, plus bruteForceProtected (failureFactor 10) so lockouts are events to log in the first place. Stays in-progress: this is the Keycloak-side configuration only - the application half (NFR-12's search/filter/export over these events) lands with #34-#38."
- id: "NFR-12"
