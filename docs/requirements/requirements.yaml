- id: "FR-70"
  priority: MUST
  phase: p0
  title: "A command-line transform that reads the published SPIA workbook and produces either a validated import dataset or a detailed defect report"
  status: implemented
  notes: "CLI entrypoint, --report-only default and the report writer land with P0-1/#23; the workbook reader and Appendix A.1-A.3 cell defect detection land with P0-2/#24; import dataset emission (--emit-dataset --release-name, import-dataset.json) lands with P0-9/#31 (ADR-0010)"
- id: "FR-71"
  priority: MUST
  phase: p0
  title: "The transform classifies every finding into one of three bands, and the band determines behaviour"
  status: implemented
  notes: "Band registry, per-finding band assignment, the blocking exit code and report band columns/counts land with P0-3/#25; automatic application of the auto-correctable band's corrections (--emit-dataset) lands with P0-9/#31"
- id: "FR-72"
  priority: MUST
  phase: p0
  title: "The defect report is machine-readable (JSON or CSV) and human-readable"
  status: implemented
  notes: "Grouped defect report lands with P0-8/#30 (ADR-0009): findings are grouped Band -> FindingCode (BAND_REPORT_ORDER, blocking bands first, never Band's own declaration order), report.json's flat findings list is replaced by defect_classes (schema_version 7) carrying band/blocks_import/action/finding_count once per group, Finding.location becomes a structured CellRef (nptc_transform.cellref) replacing the opaque Sheet!Cell string end-to-end, and actions.py's ACTION_BY_CODE states the required action for every FindingCode. No CSV - report.json plus report.md stay the only two output files."
- id: "FR-73"
  priority: MUST
  phase: p0
  title: "The transform is idempotent and re-runnable"
  status: implemented
  notes: "Determinism/idempotency harness and the no-clock/no-absolute-path report writer land with P0-1/#23; the guarantee is proven against real, transformed content once import dataset emission lands with P0-9/#31 (a committed real 50-row excerpt fixture, transform/tests/fixtures/spia-requesting-sample.xlsx)"
- id: "FR-74"
  priority: MUST
  phase: p0
  title: "Every code in the source is validated against both editions during transform, using the same validation engine as FR-45"
  status: in-progress
  notes: "nptc-transform run --check-terminology validates every code cell against SNOMED CT-AU and International through nptc_shared.terminology.sweep - the engine the backend's FR-45 sweep will use, not a second one (#27). The rest of FR-45's check table (FSN drift, preferred-term drift, inactivation reason/historical association pairing) lands with P0-6/#28."
- id: "FR-75"
  priority: SHOULD
  phase: p0
  title: "The transform reports semantic mismatches between the RCPA preferred term and the bound SNOMED FSN as warnings for editorial review"
  status: implemented
  notes: "nptc-transform's TERM_SPECIMEN_NOT_MODELLED/TERM_SPECIMEN_DIFFERS/TERM_TIMING_NOT_MODELLED heuristics land with P0-7/#29 (ADR-0008): a hand-typed + server-augmented specimen table (nptc_transform.specimen_table) checked against each bound concept's own Has specimen (116686009) attribute value via chunked ECL set-membership (TerminologySweep.codes_without_attribute/codes_with_attribute_value/describe), never a per-row $lookup. All three codes are Band.INFORMATIONAL - candidates for editorial review (H-03), not confirmed defects."
- id: "FR-76"
  priority: MUST
  phase: p0
  title: "The seeded data MUST be imported as a synthetic baseline release representing the state at seeding"
  status: in-progress
  notes: "The transform side lands with P0-9/#31 (ADR-0010): --emit-dataset --release-name YYYY-MM writes import-dataset.json's baseline_release block, a machine-generated release standing in for a curation cycle that never happened, so the first genuinely new release produces a meaningful diff (FR-60). Not implemented: the backend Release table and initial data load that actually import the dataset - backend/src/nptc/{catalogue,releases,db} are bare scaffolding and backend/migrations/ is empty until P1-1, so this stays in-progress rather than implemented."
- id: "FR-77"
