- id: "FR-36"
  priority: MUST
  phase: p1
  title: "Administrators can create, amend and deprecate catalogue entries directly, including codings, designations, preferred term, and all registry properties"
  status: planned
  notes: ""
- id: "FR-37"
  priority: MUST
  phase: p1
  title: "Every save requires a changelog note"
  status: in-progress
  notes: "Issue #47: nptc.catalogue.changelog.validate_changelog_note is the server-side authority - normalises the note (nptc_shared.text.normalise_for_comparison, so invisible-character padding cannot game the length floor), then refuses an empty note, one matching a low-information list ('update', 'fix', '.', and neighbours), or one shorter than 10 characters (backend/tests/test_changelog_note.py). nptc.catalogue.entries.create_entry/save_entry/save_entries and nptc.catalogue.designations.add_designation/add_synonyms/retire_designation all require reason as a mandatory keyword argument and validate it before any mutation, so a rejected note leaves no partial write or audit event (backend/tests/test_catalogue_designations.py's negative-path test). No exemption: the ADR-0010 seeded-import path uses SEED_IMPORT_NOTE, a real sentence that passes validation on its own merits. Remains in-progress: #62 is the client-side gate, and there is no HTTP surface until #149/#150."
- id: "FR-38"
  priority: MUST
  phase: p1
  title: "Concurrent editing MUST be handled with optimistic locking on row_version"
  status: in-progress
  notes: "Issue #46: catalogue_entry.row_version is owned by exactly one write path, SQLAlchemy's version_id_col on the mapped UPDATE (ADR-0012's doctrine, applied here), never a trigger or a Core update()/delete() statement - the latter is a static AST guard in backend/tests/test_sql_parameterisation.py (VERSIONED_TABLE_MODELS). nptc.catalogue.entries.save_entry rejects a stale expected_row_version before mutating anything and shows the caller the conflicting field values (EntryVersionConflictError.report); a genuine concurrent race is caught by version_id_col itself via a per-entry savepoint. A rejected save emits no audit event (backend/tests/test_catalogue_optimistic_locking.py). save_entries is the seam #63's bulk reclassify is meant to call instead of a Core bulk update. Remains in-progress: no HTTP surface until #149/#150."
- id: "FR-39"
  priority: SHOULD
  phase: p1
  title: "Bulk operations for the common editorial patterns visible in the revision history, principally reclassifying discipline across a filtered set"
  status: planned
  notes: ""
