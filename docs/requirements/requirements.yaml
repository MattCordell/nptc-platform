- id: "FR-44"
  priority: SHOULD
  phase: p1
  title: "Roles MUST be implemented as named sets of discrete permissions rather than as hard-coded checks against a role enum"
  status: implemented
  notes: "Issue #44 (ADR-0019): nptc.auth.permissions.Permission/Role/ROLE_PERMISSIONS reproduce the PRD 4.7 matrix as code, verified cell-by-cell against the PRD's own markdown table by backend/tests/test_permission_matrix.py (parses docs/prd/NPTC-Catalogue-Platform-PRD.md directly). backend/tests/test_authorisation_guard.py is the greppable acceptance criterion: an AST guard over backend/src refusing any comparison against a role-name literal or a Role enum member outside the four modules whose job is roles (permissions.py, principal.py, grants.py, db/models/user_role.py), with its own positive-control test."
- id: "FR-45"
  priority: MUST
  phase: p3
  title: "For every code binding in the catalogue, validation determines status, inactivation reason and replacement suitability"
  status: planned
  notes: ""
- id: "FR-46"
  priority: MUST
  phase: p3
  title: "Where a concept is inactive, the finding MUST include the inactivation reason and the associated historical association"
  status: planned
  notes: ""
- id: "FR-47"
  priority: MUST
  phase: p3
  title: "Every validation run executes against both the latest SNOMED CT-AU edition and the latest International edition, and the results are diffed"
  status: in-progress
  notes: "The transform's terminology pass sweeps both editions and combines them: absent from both is a defect, AU-only is not a finding at all (#27). The third case - the forecast, inactive in International while still active in AU, with its expected AU release date - belongs to the scheduled validation sweep and is still owed."
- id: "FR-48"
  priority: MUST
  phase: p3
  title: "Each validation run MUST record the fully qualified version URI of each edition it resolved against"
  status: in-progress
  notes: "A transform run with --check-terminology records every version URI the server reported, per edition, in report.json's terminology block (#27). The backend's persisted validation runs are still owed (P3)."
- id: "FR-49"
  priority: SHOULD
  phase: p3
  title: "Editions are referenced without a version parameter in normal operation, so runs target the latest available release"
  status: planned
  notes: ""
- id: "FR-50"
  priority: MUST
  phase: p3
  title: "Validation runs on demand (triggered by a Reviewer or Administrator, whole catalogue or filtered subset) and on a schedule"
  status: planned
  notes: ""
- id: "FR-51"
  priority: SHOULD
  phase: p3
  title: "The scheduled run SHOULD execute at least weekly, and the schedule SHOULD be configurable"
  status: planned
  notes: ""
- id: "FR-52"
  priority: MUST
  phase: p0
  title: "Validation MUST NOT be implemented as one $validate-code call per code per edition"
  status: implemented
  notes: "nptc_shared.terminology.sweep.TerminologySweep (#27): ceil(N/chunk) ValueSet/$expand calls for bulk status (NPTC_TX_CHUNK_SIZE, default 300), one targeted $lookup per unresolved code at NPTC_TX_MAX_CONCURRENCY (default 4) concurrency, Retry-After/backoff inherited from OntoserverClient. Request counts are asserted, not assumed. Defaults and their tuning procedure: ADR-0005."
- id: "FR-53"
  priority: MUST
  phase: p0
  title: "Terminology server access MUST be behind an interface with a stub implementation for testing"
  status: implemented
  notes: "nptc_shared.terminology: TerminologyClient Protocol, StubTerminologyClient (no network access) and OntoserverClient (httpx, against any FHIR R4 terminology server), one contract test suite runs against both (#26, ADR-0003). The chunked FR-52/FR-84 validation that consumes it lands with #27."
- id: "FR-54"
  priority: SHOULD
  phase: p3
  title: "Terminology server failure MUST degrade gracefully"
  status: in-progress
  notes: "The client classifies every failure (TerminologyError.retryable, #26) and the sweep propagates rather than recording absences (#27); nptc-transform exits 3 and writes no report at all, since a report missing only its terminology findings is indistinguishable from a clean one. The application-side policy - incomplete runs, cached prior results staying visible and dated, browsing/search unaffected - is still owed (P3)."
