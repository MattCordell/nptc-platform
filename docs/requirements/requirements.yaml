- id: "NFR-20"
  priority: MUST
  phase: p1
  title: "Every request authorised server-side against the internal user record"
  status: in-progress
  notes: "Issue #44 (ADR-0019): nptc.auth.principal.principal_for derives every Principal's permissions from user_role grants read via the session (never from a token claim - the realm declares no roles, ADR-0014), and nptc.auth.authorisation.require_permission/may_act_on are the only sanctioned checks (backend/tests/test_authorisation_guard.py's AST guard). Issue #142 wires this into a real request pipeline for the first time: all seven routes now served (GET /auth/me plus six under /catalogue) resolve a Principal server-side and, for the catalogue routes, check permission_dep(Permission.CATALOGUE_BROWSE) - a permission, never a role name (FR-44). Stays in-progress: every route that exists is authorised server-side, but the authenticated and write surfaces (#143, #149/#150) have not landed, so 'every request' is a claim about a surface that is still mostly unbuilt."
