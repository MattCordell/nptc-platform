  status: planned
  notes: "The transform's seeding-time treatment (P0-9/#31): a Discipline/Subgroup cell holding a compound 'X or Y' value is split into separate provisional property values (COMPOUND_VALUE_SPLIT, auto-correctable) rather than seeded as one string. The governed code system itself, owned by RCPA-QAP, belongs to the backend registry (P1) and remains planned."
