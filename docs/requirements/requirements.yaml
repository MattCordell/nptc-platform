# Requirements register (Foundation issue F-5, FR-05 of the delivery plan).
#
# One entry per FR-nn/NFR-nn in docs/prd/NPTC-Catalogue-Platform-PRD.md. Extracted
# once by a throwaway script (title = the requirement's own first sentence, so the
# register quotes the PRD rather than paraphrasing it) and hand-maintained from
# here on - see CONTRIBUTING.md and scripts/traceability_check.py.
#
# Fields:
#   id       FR-nn / NFR-nn, stable, matches the PRD exactly.
#   priority MUST / SHOULD / MAY, the PRD's own RFC-2119 scheduling band.
#   phase    foundation / p0 / p1 / p2 / p3 / p4 / p5 / governance - descriptive
#            grouping only (where this requirement conceptually belongs in the
#            delivery narrative). It drives no check in traceability_check.py and
#            need not match the phase of the GitHub issue that actually delivers
#            the requirement - that issue's own "## Requirement IDs" section is
#            the authority on what delivers what.
#   title    Short label, quoted from the PRD.
#   status   planned / in-progress / implemented / deferred / n-a.
#   notes    Free text - deferral rationale, links to an open issue, etc.
#   evidence Optional. A repo-relative path (optionally with a #fragment, e.g.
#            ".github/workflows/ci.yml#transform-offline") demonstrating the
#            requirement without a pytest test - for infrastructure/process
#            requirements with no plausible test (see ADR-0002). May be set
#            alongside a test marker (e.g. a requirement partially covered by
#            a test and partially by a non-test artefact); the two are not
#            mutually exclusive. traceability_check.py checks the path exists,
#            is a file, is inside the repo, and - if a #fragment is given -
#            that the fragment string appears literally somewhere in the
#            target file (a weak, format-agnostic check that still catches
#            the target being renamed or deleted out from under it).
#
# Moving a requirement to `implemented` requires either a test carrying
# @pytest.mark.req("<id>") or an evidence: path (or both); traceability_check.py
# enforces this in CI, along with: every ID here is used at least once in a
# test and vice versa. Whether a MUST requirement has a corresponding GitHub
# issue is a manual review concern, not a CI gate.

- id: "FR-01"
  priority: MUST
  phase: p2
  title: "An administrator may grant and revoke any role"
  status: in-progress
  notes: "Issue #44 (ADR-0019): nptc.auth.grants.grant_role/revoke_role check role.grant.any (or role.grant.member for the Reviewer promote-to-Member carve-out); assert_not_last_administrator (backend/src/nptc/auth/grants.py) row-locks every active administrator grant so a revocation, suspension, or account closure cannot drop the count to zero - proven with two genuinely concurrent connections in backend/tests/test_grants.py::test_concurrent_revocation_of_the_last_two_administrators_leaves_exactly_one. No grant/revoke HTTP endpoint exists yet (P2's); scripts/grant_role.py is the one-time operator bootstrap path for the first administrator, since the guard otherwise makes that unreachable."
- id: "FR-02"
  priority: SHOULD
  phase: p2
  title: "Administrator actions that are irreversible or high-impact require an explicit confirmation step that restates what will happen"
  status: planned
  notes: ""
- id: "FR-03"
  priority: MUST
  phase: p1
  title: "Every catalogue entry MUST carry an immutable business_key assigned at creation and never reused"
  status: in-progress
  notes: "Issue #46: catalogue_entry (backend/src/nptc/db/models/catalogue_entry.py) mints business_key from a dedicated Postgres sequence (nptc.catalogue.entries.allocate_business_key), formatted NPTC-###### (backend/tests/test_catalogue_business_key.py). Immutability and never-reused are database invariants: business_key is UNIQUE, excluded from the app role's column-level UPDATE grant, and there is no DELETE/TRUNCATE grant at all on catalogue_entry (backend/tests/test_db_catalogue_entry.py). advance_sequence_past reconciles the sequence with ADR-0010's seeded baseline. Remains in-progress: no create/edit HTTP surface until #149/#150, and the transform's own minting side of FR-03 (ADR-0010) is separately covered by transform/tests/test_dataset_fixture.py."
- id: "FR-04"
  priority: MUST
  phase: p1
  title: "Synonyms MUST be modelled as separate rows, not as a delimited string"
  status: implemented
  notes: "Issue #47: the designation table (backend/src/nptc/db/models/designation.py) has no delimited-string column at all; nptc.catalogue.designations.add_synonyms inserts each synonym as its own row. The sample's real defects - a comma delimiter, a doubled semicolon, whitespace variants - are split by the existing transform/src/nptc_transform/cell_defects.split_synonyms (not reimplemented in the backend, per ADR-0001/FR-74) and inserted as the correct individual rows with no empty row (backend/tests/test_catalogue_designations.py). A partial unique index (ix_designation_no_duplicate_active_term) refuses a duplicate active (entry_id, term, language) at the database layer (backend/tests/test_db_designation.py). Remains without an HTTP surface until #149/#150; FR-05 collision detection is #49."
- id: "FR-05"
  priority: MUST
  phase: p1
  title: "On save, the system MUST detect collisions between a designation and a designation on a different active entry"
  status: implemented
  notes: "Issue #49: nptc.catalogue.collisions.assert_no_error_collisions rejects a save where a synonym exactly matches another live (draft/active) entry's preferred term, or the symmetric case - checked in every write path of nptc.catalogue.designations/entries before a row is constructed, so a rejected save leaves no audit event. warning_collisions/acknowledge_collision (gated on Permission.VALIDATION_ACKNOWLEDGE, FR-44) implement the warning severity: the same synonym on multiple live entries is visible and resolvable to an acknowledged state (designation_collision_acknowledgement, scoped per entry) rather than recurring every save. The comparison key (nptc_shared.similarity.collision_key) folds case, Unicode whitespace and punctuation, stored/indexed on designation.term_key/catalogue_entry.preferred_term_key so a case, whitespace or punctuation variant is still caught (PRD Appendix A.1). See backend/tests/test_catalogue_collisions.py, which uses the PRD Appendix A.5 fixtures ('Adrenal Ab', 'ADA2') verbatim."
- id: "FR-06"
  priority: MUST
  phase: p1
  title: "SNOMED CT identifiers MUST be stored, transported and exported as strings at every layer"
  status: implemented
  notes: "shared/nptc_shared/sctid.py: SCTID is a string-only dataclass with ^[0-9]{6,18}$ format and Verhoeff check-digit validation, no __int__/__index__ (#32, P0-10). transform/nptc_transform/cell_defects.py screens every text-typed code cell with it unconditionally, after the same correction dataset.py applies before seeding, so CODE_NOT_WELL_FORMED blocks --emit-dataset on its own rather than only ever firing as a side effect of the opt-in --check-terminology network pass (#131); the terminology pass filters on the same check before submitting anything, rather than reporting it a second time (#27). Issue #37: nptc.audit.serialisation.normalise_json_value normalises an SCTID to its .value (a str) for an audit diff, and raises on a bare int in its place rather than coercing it - test_audit_diff_write_path.py::test_sctid_in_a_diff_is_stored_as_a_jsonb_string proves the stored JSONB value is genuinely a string. Issue #48: code_binding.code is TEXT with ck_code_binding_code CHECK (nptc_sctid_is_valid(code)) - a database function (nptc.db.functions, ADR-0023) enforcing both ^[0-9]{6,18}$ and Verhoeff at the column itself, parity-tested against has_valid_format/has_valid_check_digit (test_db_sctid_function.py). The xlsx round-trip layer is FR-07, tracked separately."
- id: "FR-07"
  priority: MUST
  phase: p1
  title: "The spreadsheet export MUST write the code cell with an explicit text format"
  status: planned
  notes: ""
- id: "FR-08"
  priority: SHOULD
  phase: p1
  title: "An entry SHOULD permit at most one active code binding"
  status: implemented
  notes: "Issue #48: ix_code_binding_one_active_per_entry (UNIQUE (entry_id) WHERE status = 'active') enforces at most one active binding per entry at the database layer. Retirement is a status transition (nptc.catalogue.bindings.retire_binding), never a DELETE (REVOKE_CODE_BINDING_DELETE_SQL); ck_code_binding_retirement_reason makes retirement_reason mandatory exactly when status='retired', and replaced_by_binding_id (nullable, populated only in the replacement case PRD FR-08 describes) may only be set on a binding that is itself retired (ck_code_binding_replaced_by_requires_retired) and never on itself (ck_code_binding_no_self_supersession). See backend/tests/test_db_code_binding.py. Issue #49 closes the other half - ix_code_binding_one_active_entry_per_code (UNIQUE (system, code) WHERE status = 'active') blocks the same code being bound active on two different entries, with CodeBindingCodeAlreadyBoundError as the pre-insert domain error. See backend/tests/test_catalogue_bindings.py."
- id: "FR-09"
  priority: MUST
  phase: p1
  title: "Adding, deprecating or amending a property definition MUST NOT require a schema migration, application restart, or code deployment"
  status: implemented
  notes: "Issue #51 (ADR-0012): PropertyDefinition/PropertyValue land as a conventional relational table plus row-per-value storage, so a new definition is a plain row insert. Proven against a running application by backend/tests/test_property_registry_no_migration_required.py, which opens two independent connections off one already-migrated engine and defines/uses a new property with no migration and no restart in between."
- id: "FR-10"
  priority: MUST
  phase: p1
  title: "A property of datatype code MUST carry a terminology binding, not merely a datatype"
  status: implemented
  notes: "Issue #51 (ADR-0012): the binding is four real columns (binding_target, value_set_uri, strength, edition) with CHECK ((datatype = 'code') = (binding_target IS NOT NULL)) and CHECK (binding_target IS DISTINCT FROM 'value_set' OR value_set_uri IS NOT NULL), making a code-without-a-binding, or a value_set binding without a URI, unrepresentable at the schema level - backend/tests/test_db_property_definition.py asserts both refusals with sqlstate 23514."
- id: "FR-11"
  priority: MUST
  phase: p1
  title: "A property definition MUST NOT be deletable once any value has been recorded against it or once it has appeared in any published export"
  status: implemented
  notes: "Issue #51 implements the stronger, unconditional form ADR-0012 records: no DELETE grant on property_definition at all, so the PRD's conditional test is never asked. backend/tests/test_db_property_definition.py's test_app_role_is_refused_delete/test_app_role_is_refused_truncate assert 42501."
- id: "FR-12"
  priority: MUST
  phase: p1
  title: "A property key MUST be immutable"
  status: implemented
  notes: "Issue #51: a column-level UPDATE grant excludes key/id/index_seq/origin/created_at, failing 42501 regardless of ORM or application code, plus a Python-level @validates guard that fails loudly on reassignment. backend/tests/test_db_property_definition.py's six privilege-refusal tests (five asserting 42501, one asserting 428C9 for the GENERATED ALWAYS index_seq column) prove the database-level guarantee; ADR-0012's Consequences section had named these as a #55 deliverable, but they land with #51 instead, matching every other table-creation issue's own precedent (#46-#48 each shipped its own grants and refusal tests with the table, not in a later issue) and because #51's own FR-09 acceptance test and system-property bootstrap already exercise the app role against this table."
- id: "FR-13"
  priority: SHOULD
  phase: p1
  title: "Properties marked filterable SHOULD have a supporting index created automatically"
  status: planned
  notes: "ADR-0012 (issue #136) fixes the index shapes (GIN jsonb_path_ops for coded properties, expression indexes for string/url and decimal/positiveInt) as partial indexes named ix_propval_p{index_seq}_{slot}, and defers the DDL executor's topology to #54 as an explicit open question with two ruled-out candidates. Stays planned: no executor exists yet."
- id: "FR-14"
  priority: MUST
  phase: p1
  title: "Anonymous and authenticated users can search the approved catalogue across preferred terms, synonyms, the FSN, the AU preferred term and the SNOMED code in one query field"
  status: in-progress
  notes: "Issue #142 (ADR-0024): pg_trgm trigram search over an IMMUTABLE unaccent wrapper (nptc_search_text, migration 0012), matching an entry's own preferred term and its active designations in one query field, insensitive to case and diacritics, with one result per entry scored by its best match. Stays in-progress rather than implemented: FR-14 names five searchable fields and this covers two. The FSN and the AU preferred term are not yet in the union (two more % scans and two more indexes), and the SNOMED code itself is FR-17's exact-code lookup, owned by #140 - ADR-0024's Consequences records the deferral and why."
- id: "FR-15"
  priority: MUST
  phase: p1
  title: "Search MUST tolerate typographical error and word-order variation"
  status: in-progress
  notes: "Issue #142 (ADR-0024): trigram similarity, so a transposition or a dropped letter still scores - the case a tsvector search cannot serve at all, since a misspelling stems to a different lexeme and scores exactly zero. Threshold 0.3 (pg_trgm's own default), re-asserted in the statement's HAVING because set_limit is connection-scoped and connections are pooled. Word-order variation is served incidentally: a trigram set is unordered. Stays in-progress alongside FR-14, whose remaining searchable fields it inherits."
- id: "FR-16"
  priority: MUST
  phase: p1
  title: "Results can be filtered by any property marked filterable, presented as faceted filters with result counts"
  status: planned
  notes: "Untouched by issue #142, which serves property values on an entry but offers no filtering and no facets: /catalogue/entries takes only limit and after, and /catalogue/search only q. The registry half FR-16 depends on now exists (property_definition.filterable, #51; the datatype handlers' supported_filter_ops/filter_clause, #53), so what is missing is the query surface and the facet counts, owned by #138. Stays planned."
- id: "FR-17"
  priority: MUST
  phase: p1
  title: "Exact-code lookup MUST be unambiguous and MUST be reachable by direct URL: /catalogue/{business_key} and /catalogue/code/{system_token}/{code}"
  status: planned
  notes: ""
- id: "FR-18"
  priority: SHOULD
