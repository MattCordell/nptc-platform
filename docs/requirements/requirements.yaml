- id: "NFR-37"
  priority: MUST
  phase: foundation
  title: "The test suite MUST run with no network access"
  status: implemented
  evidence: ".github/workflows/ci.yml#backend-integration"
  notes: "transform-offline (issue #5/F-2) blocks outbound egress via iptables for transform/tests and shared/tests; backend-integration (issue #33, ADR-0011) does the same for backend/tests and scripts/tests, pulling deploy/compose.yml's pinned Postgres tag before the block and disabling Ryuk (TESTCONTAINERS_RYUK_DISABLED) to avoid a second, post-block image pull. Together the two jobs run every one of testpaths' four directories under a network-egress block at least once. Container traffic transits FORWARD, not OUTPUT, so this proves the test process makes no other egress, not that the container itself makes none - the stated, deliberate scope (ADR-0011)."
- id: "NFR-38"
  priority: MUST
  phase: foundation
  title: "Specific tests that MUST exist, because each closes a defect class documented in Section 16"
  status: planned
  notes: "The 16 mandated tests land with the features they close; this ID tracks the umbrella requirement. Test 13 (a code not subsumed by <<71388002 blocks, and the check is asserted to issue ceil(N/chunk_size) batch requests rather than one per code) landed with #27. Test 5 (audit log tampering is detected) is now fully landed: issue #36's hash chain detection (backend/tests/test_audit_tamper_detection.py) plus issue #38's operator-command half (scripts/verify_audit_chain.py, backend/tests/test_verify_audit_chain_cli.py). Test 8 (a concurrent edit with a stale row_version is rejected) landed with #46: backend/tests/test_catalogue_optimistic_locking.py::test_stale_row_version_is_rejected_and_names_the_conflict. Test 4 (a synonym matching another entry's preferred term is rejected at error severity) landed with #49: backend/tests/test_catalogue_collisions.py::test_synonym_matching_another_entrys_preferred_term_is_rejected, using the PRD Appendix A.5 'Adrenal Ab'/'21-Hydroxylase Ab' fixture verbatim."
