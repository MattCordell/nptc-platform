- id: "FR-20"
  priority: MUST
  phase: p1
  title: "A documented, versioned, read-only JSON API over the approved catalogue, available without authentication, with the same content as the public UI"
  status: implemented
  notes: "Issue #142 (ADR-0024): six GET routes under /api/v1/catalogue, served to an anonymous caller with no credential - entries (keyset-paged), entry detail, designations, bindings, properties, and search. Documented in docs/architecture/public-api.md and in docs/api/openapi.json, which is generated from the app and drift-tested. Only 'active' entries are visible anywhere (nptc.catalogue.queries.PUBLIC_STATUSES); draft/deprecated/withdrawn are absent from list and search and 404 identically to a never-minted key, so the response cannot confirm an unpublished entry exists. The two no-leak criteria are asserted whole-body against raw response text for every route under the prefix, with positive controls for both regexes (backend/tests/test_api_public_response_hygiene.py): no internal UUID in any body (NFR-04), and no SNOMED code serialised as a JSON number (FR-06). Rate limiting and caching (FR-22) are deliberately out of scope and not implemented."
- id: "FR-21"
  priority: SHOULD
  phase: p1
  title: "Published FHIR artefacts for each release are served as static files at stable, versioned URLs"
  status: planned
  notes: ""
- id: "FR-22"
  priority: SHOULD
  phase: p1
  title: "Anonymous API access is rate-limited by IP"
  status: planned
  notes: ""
- id: "FR-23"
  priority: MUST
  phase: p2
  title: "Provisional users, Members, Reviewers and Administrators can submit a proposed new test"
  status: planned
  notes: ""
- id: "FR-24"
  priority: MUST
  phase: p2
  title: "Computed fields MUST NOT appear as editable inputs anywhere, for any role"
  status: in-progress
  notes: "Issue #47: Designation.length (backend/src/nptc/db/models/designation.py) is a bare Python @property with no backing column and deliberately no setter - nptc.catalogue.designations.preferred_term_length is the one computation, never duplicated. backend/tests/test_catalogue_designations.py asserts both the missing setter (AttributeError on assignment) and the missing column. Remains in-progress: this covers only the designation/preferred-term-length case: the wider claim (no computed field editable anywhere, for any role) needs the registry (#51-#55) and the edit-screen work (#149-#151) before it can move to implemented."
