- id: "FR-06"
  priority: MUST
  phase: p1
  title: "SNOMED CT identifiers MUST be stored, transported and exported as strings at every layer"
  status: in-progress
  notes: "shared/nptc_shared/sctid.py: SCTID is a string-only dataclass with ^[0-9]{6,18}$ format and Verhoeff check-digit validation, no __int__/__index__ (#32, P0-10). transform/nptc_transform/cell_defects.py screens every text-typed code cell with it unconditionally, after the same correction dataset.py applies before seeding, so CODE_NOT_WELL_FORMED blocks --emit-dataset on its own rather than only ever firing as a side effect of the opt-in --check-terminology network pass (#131); the terminology pass filters on the same check before submitting anything, rather than reporting it a second time (#27). Issue #37: nptc.audit.serialisation.normalise_json_value normalises an SCTID to its .value (a str) for an audit diff, and raises on a bare int in its place rather than coercing it - test_audit_diff_write_path.py::test_sctid_in_a_diff_is_stored_as_a_jsonb_string proves the stored JSONB value is genuinely a string. DB check constraint, API/JSON/CSV/xlsx layers still owed."
