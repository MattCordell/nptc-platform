# Backlog: Foundation (Foundation issue F-6).
#
# One entry per top-level GitHub issue. Rendered into GitHub issues by
# scripts/backlog_sync.py, matched either by the explicit `github_issue:`
# number below - issues #4-#10 were created out of band, ahead of this file,
# so they are adopted rather than duplicated - or, absent that field, by the
# hidden `<!-- nptc-backlog-id: ID -->` marker backlog_sync.py writes into the
# body of every issue it creates itself.
#
# Fields (same schema in every docs/backlog/*.yaml file):
#   id           F-n / P0-n / ... - stable, referenced by requirements.yaml
#                and by other backlog items.
#   github_issue Real issue number to adopt, if one already exists outside
#                this process. Omit for an item backlog_sync.py should create.
#   title        Issue title.
#   milestone    Must match a milestone title backlog_sync.py ensures exists.
#                Also the phase - there is deliberately no separate phase/*
#                label, that would just duplicate the milestone.
#   issue_type   GitHub's native Issue Type: Task / Bug / Feature (org setting,
#                see ISSUE_TYPES in backlog_sync.py - "Epic" also exists there
#                but predates this project and is deliberately unused).
#   priority     MUST / SHOULD / MAY - the PRD's own RFC-2119 scheduling band.
#                Set as the "Priority" single-select field on the NPTC Catalogue
#                Platform Projects-v2 board (backlog_sync.py creates the board
#                and field if missing) - not a label, GitHub Issues has no
#                native priority field of its own.
#   labels       Applied in full for anything backlog_sync.py's LABEL_TAXONOMY
#                covers (area names, status/*, governance/open-issue); a label
#                an issue carries from outside that taxonomy (e.g. a default
#                GitHub label like "bug") is left alone either way.
#   requirements FR-nn/NFR-nn this item implements. Empty list for a pure
#                chore. Cross-checked against docs/requirements/requirements.yaml
#                by scripts/traceability_check.py.
#   tests        NFR-38.n mandated-test references, where applicable.
#   summary      One paragraph: what, and why.
#   checklist    Implementation steps, rendered as a GitHub task list. A
#                string prefixed "[x] " renders checked - tick it in the same
#                PR that finishes the step (CONTRIBUTING.md, "Issue checklists").
#   docs         Documentation this item must touch (one string per doc), or
#                the single-element list ["none: <reason>"]. Never empty.
#   acceptance   Concrete, testable criteria (not rendered as a checklist).
#   children     Nested items, same shape, for the handful of genuinely
#                multi-week items; backlog_sync.py creates these as GitHub
#                native sub-issues of the parent.

- id: F-1
  github_issue: 4
  title: "Repository layout, Python/Node tooling, pre-commit"
  milestone: "Foundation"
  issue_type: Task
  priority: MUST
  labels: [infra]
  requirements: [FR-74]
  summary: >
    Establish the monorepo layout and local tooling every later issue builds on: a uv
    workspace covering backend/, transform/ and shared/ (one lockfile, one venv -
    shared/ exists so the P0 transform never has a second, divergent validation
    implementation, FR-74), ruff + mypy --strict + pytest at the workspace root, a pnpm
    workspace for frontend/ (Vite + React 18 + TypeScript + ESLint 9 + Prettier +
    Vitest), and pre-commit tying it together.
  checklist:
    - "[x] uv workspace: backend/, transform/, shared/ under one lockfile"
    - "[x] ruff + mypy --strict + pytest configured at the workspace root"
    - "[x] pnpm workspace for frontend/ with ESLint 9, Prettier, Vitest"
    - "[x] .pre-commit-config.yaml wiring the above together"
    - "[x] .gitattributes normalises to LF, PowerShell scripts as the deliberate CRLF exception"
  docs:
    - "none: CONTRIBUTING.md already documents the commands this issue adds"
  acceptance:
    - "uv sync --all-packages resolves cleanly; uv run pytest passes"
    - "uv run ruff check ., uv run ruff format --check ., uv run mypy all pass"
    - "pnpm install, pnpm typecheck, pnpm lint, pnpm format:check, pnpm test, pnpm build all pass"
    - "pre-commit run --all-files passes clean on a fresh clone"

- id: F-2
  github_issue: 5
  title: "Core CI: lint, typecheck, test, coverage"
  milestone: "Foundation"
  issue_type: Task
  priority: MUST
  labels: []
  requirements: [NFR-37, NFR-39]
  summary: >
    A ci.yml workflow that lints, typechecks and tests the Python workspace and the
    frontend on every PR and push to main, with a coverage floor, plus a dedicated job
    that proves the transform and shared test suites need no network access (NFR-37) by
    actually blocking egress. Also pr-hygiene.yml, enforcing a Conventional Commit
    title, a linked issue, and a stated documentation impact on every PR.
  checklist:
    - "[x] ci.yml: backend/frontend/transform lint + typecheck + test + coverage floor"
    - "[x] Network-egress-blocked job for transform/shared tests (NFR-37)"
    - "[x] Path filters so a docs-only PR skips the full matrix"
    - "[x] pr-hygiene.yml: Conventional Commit title, linked issue, documentation-impact line"
    - "[x] Every third-party action pinned to a commit SHA"
  docs:
    - "none: workflows are self-documenting via inline comments; CONTRIBUTING.md already describes the process"
  acceptance:
    - "A PR touching only backend/src or frontend/src runs the full matrix; a docs-only PR skips it"
    - "The network-blocked job genuinely has no network for its test step"
    - "A PR with a non-Conventional-Commit title, no linked issue, or an undeclared doc impact fails pr-hygiene"

