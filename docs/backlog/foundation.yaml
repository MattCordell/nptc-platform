    - "[x] Issue templates (task, bug, spike, governance) and PR template"
    - "[x] CODEOWNERS"
    - "[x] ADR-0001: stack decision and rejected alternatives"
    - "Branch ruleset on main - deferred, not required for a solo-dev project (see docs/operations/repo-configuration.md); also currently blocked by the org's GitHub plan regardless"
  docs:
    - "none: this issue is itself the documentation baseline"
  acceptance:
    - "LICENSE, NOTICE, CODE_OF_CONDUCT.md, SECURITY.md, CONTRIBUTING.md all present and accurate"
    - "Issue and PR templates exist and match the process CONTRIBUTING.md describes"
    - "Deferred: main requiring a PR and all status checks green is not GitHub-enforced while this is a single-committer project on the Free plan"

- id: F-5
  github_issue: 8
  title: "Requirements register and traceability check"
  milestone: "Foundation"
  issue_type: Task
  priority: MUST
  labels: [docs]
  requirements: [NFR-38]
  summary: >
    docs/requirements/requirements.yaml (one entry per FR-nn/NFR-nn extracted from the
    PRD), scripts/traceability_check.py (fails CI on an unknown ID, an implemented
    requirement with no test, or - once docs/backlog/ holds real YAML - a MUST with no
    backlog item), and docs.yml running it in CI alongside markdownlint and a link check.
    This is also where NFR-38 (the sixteen specific mandated tests) gets its
    cross-referencing mechanism: each backlog item's `tests:` field cites the NFR-38.n
    it closes, and traceability.md rolls them up.
  checklist:
    - "[x] docs/requirements/requirements.yaml: 146 FR/NFR entries"
    - "[x] scripts/traceability_check.py with unit tests"
    - "[x] docs.yml: markdownlint, lychee link check, traceability check"
  docs:
    - "[x] docs/requirements/requirements.yaml and docs/requirements/traceability.md: created by this issue"
  acceptance:
    - "traceability_check.py reports zero unmatched IDs"
    - "Every requirement marked implemented carries a test with @pytest.mark.req(\"<id>\")"

- id: F-6
  github_issue: 9
  title: "Backlog YAML schema, backlog_sync.py, label/milestone bootstrap"
  milestone: "Foundation"
  issue_type: Task
  priority: MUST
  labels: [infra, docs]
  requirements: []
  summary: >
    The backlog itself: one YAML file per phase under docs/backlog/, each item carrying
    requirement IDs, a checklist, a docs: field, and - for the genuinely multi-week
    items - children: rendered as GitHub native sub-issues. Plus scripts/backlog_sync.py:
    idempotent, dry-run by default, reconciling labels/milestones and creating or
    updating issues matched by a hidden marker or an explicit github_issue: number. This
    issue also backfills the seven already-created Foundation issues (#4-#10) so they
    are adopted rather than duplicated.
  checklist:
    - "[x] docs/backlog/{foundation,p0,p1}.yaml written in full"
    - "[x] scripts/backlog_sync.py: label/milestone reconciliation, marker matching, github_issue adoption, sub-issue creation"
    - "[x] Unit tests for backlog_sync.py's planning logic"
    - "[x] docs.yml: backlog_sync.py --dry-run on PRs touching docs/backlog/**"
    - "[x] docs/backlog/README.md: placeholder replaced with the real thing"
  docs:
    - "[x] docs/backlog/README.md: placeholder content replaced with the real thing"
  acceptance:
    - "backlog_sync.py --dry-run after a real run shows no further changes (idempotent)"
    - "Running it twice creates no duplicate issues"
    - "The nine multi-week items get real GitHub sub-issues with a working progress count"
    - "The seven existing Foundation issues (#4-#10) are adopted, not duplicated"

