- id: F-4
  github_issue: 7
  title: "Governance docs, issue/PR templates, CODEOWNERS, branch ruleset"
  milestone: "Foundation"
  issue_type: Task
  priority: MUST
  labels: []
  requirements: []
  summary: >
    Governance and contribution surface: Apache-2.0 LICENSE/NOTICE (SNOMED CT and SPIA
    content carved out as separately licensed and not vendored), CONTRIBUTING.md,
    SECURITY.md, CODE_OF_CONDUCT.md, CODEOWNERS, PR and issue templates, ADR-0001
    recording the stack decision, and a branch protection ruleset - deferred, not
    applied. GitHub blocks it outright for now (branch protection on a private repo
    needs GitHub Team/Enterprise for an org, and aehrc is on Free), and the maintainer
