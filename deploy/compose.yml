# NPTC platform - local stack (Foundation issue F-7, NFR-41/42).
#
# `docker compose -f deploy/compose.yml up` brings Postgres and Keycloak up
# healthy from a clean volume, with only deploy/.env.example copied to
# deploy/.env - no other manual steps (NFR-41). Everything else in the
# eventual stack (the API, the worker, the frontend, Caddy) lands with the
# backlog issues that build them; this file is deliberately just the two
# stateful services nothing else can be developed against without.
#
# No compose.dev.yml/compose.prod.yml overlay exists yet: there is only one
# environment so far (this one) and nothing container-specific to
# differentiate. compose.dev.yml lands once the backend/frontend containers
# exist and need dev-only bind mounts or hot reload; the hardened production
# overlay (non-root, read-only containers) is P5 per the delivery plan.

name: nptc

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nptc

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3-0
    restart: unless-stopped
    # start-dev, no volume: the realm below (ADR-0014) is imported fresh on
    # every container start, so reproducibility is by construction and any
    # console tinkering is discarded on restart - a stronger guarantee than
    # persisting Keycloak would give. Persisting Keycloak (KC_DB=postgres, a
    # production start mode) is deployment hardening (P5), not here.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      NPTC_FRONTEND_BASE_URL: ${NPTC_FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # No curl/wget in the Keycloak image - probe via bash's /dev/tcp
      # instead. Two probes, both required: the management-port health
      # endpoint (KC_HEALTH_ENABLED above) proves the process started, and
      # the realm's own discovery document proves the import in
      # deploy/keycloak/realm/nptc-realm.json actually completed (NFR-03) -
      # "healthy" means "the realm imported", not just "the process is up".
      # grep -E '^HTTP/1\.1 200' anchors to the response's own status line, not
      # merely "200 OK" anywhere in the response - the discovery document's
      # body is JSON and could otherwise contain that substring coincidentally.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -qE '^HTTP/1\.1 200' <&3 &&
          exec 4<>/dev/tcp/localhost/8080 &&
          echo -e 'GET /realms/nptc/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&4 &&
          grep -qE '^HTTP/1\.1 200' <&4
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - nptc

volumes:
  postgres-data:

networks:
  nptc:
