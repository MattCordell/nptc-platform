[project]
name = "nptc-transform"
version = "0.0.0"
description = "P0 seeding transform: converts the published SPIA workbook into a validated import dataset or a defect report (PRD section 12)."
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "typer>=0.13",
    "nptc-shared",
    # transform/tests/conftest.py imports httpx directly, for the NFR-37
    # network guard - it currently resolves only transitively through
    # nptc-shared. Declared explicitly, matching shared/pyproject.toml's pin,
    # so this package's own test suite does not fail at collection on a
    # dependency it uses but never declared, should the transitive path ever
    # change (e.g. ADR-0003's transport choice).
    "httpx>=0.28",
]

[project.scripts]
nptc-transform = "nptc_transform.cli:app"

[tool.uv.sources]
nptc-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nptc_transform"]
