[project]
name = "nptc-shared"
version = "0.0.0"
description = "Code shared between the backend API and the P0 seeding transform: SCTID/Verhoeff validation, text normalisation, and the terminology client contract (FR-74)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nptc_shared"]
