name: PR hygiene

# Enforces the process from CONTRIBUTING.md mechanically rather than relying
# on everyone remembering it: a Conventional Commit title, a linked issue, a
# stated documentation impact, and (once docs/backlog/ exists - Foundation
# issue F-6) a ticked backlog checklist on feature PRs.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"

      - name: PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|test|refactor|perf|build|ci|revert)(\([a-z0-9./-]+\))?!?: .+'
          if ! echo "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit."
            echo "Expected e.g. 'feat(registry): add datatype handler registry'. See CONTRIBUTING.md."
            exit 1
          fi

      - name: PR body links an issue
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! echo "$BODY" | grep -qiE '(closes|fixes|resolves|refs) +#[0-9]+'; then
            echo "::error::PR body must link an issue, e.g. 'Refs #12' or 'Closes #12'. See CONTRIBUTING.md."
            exit 1
          fi

      # Dependabot PRs never link an issue (there is no per-bump issue to link) and a
      # routine dependency bump has no documentation impact by construction - both
      # checks above are about human-authored process, not applicable to automation.
      #
      # The exemption tests pull_request.user.login, the PR's author, not
      # github.actor, which is whoever triggered *this event*. With github.actor
      # the exemption silently missed: labelling or editing a Dependabot PR
      # re-runs this workflow as the human who did it, and the issue-link check
      # then failed a bot PR it was meant to skip (seen on PRs #13-#16).
      - name: Documentation impact is declared
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Any file outside docs/** and *.md counts as "source" for this gate - the
          # same rule ci.yml's own `code` path filter expresses (see its `changes`
          # job) - not just the four */src/** trees. That widened scope is what
          # catches a PR touching only scripts/, deploy/ or .github/workflows/: F-7
          # added six env vars with no docs/operations/configuration.md because the
          # old pathspec list never looked at deploy/ (issue #87).
          changed_src=$(git diff --name-only "origin/$BASE...HEAD" -- . \
            ':(exclude)docs/**' ':(exclude)*.md' ':(exclude).github/ISSUE_TEMPLATE/**')
          # "Docs changed" recognises *any* markdown file, not just docs/** - CONTRIBUTING.md's
          # own table names README.md and CONTRIBUTING.md as legitimate targets (setup,
          # quickstart), so a deploy/compose.yml + README-quickstart PR must have an honest
          # way to pass without a no-doc-impact reason, not just docs/**-rooted changes.
          changed_docs=$(git diff --name-only "origin/$BASE...HEAD" -- 'docs/**' '*.md')
          if [ -z "$changed_src" ] || [ -n "$changed_docs" ]; then
            exit 0
          fi

          # grep for the literal string 'no-doc-impact:' used to pass on the committed
          # PR_TEMPLATE.md's own unticked boilerplate - it contains that exact string
          # (issue #87). Require a real, non-empty reason instead - CONTRIBUTING.md's
          # own documented contract is a bare `no-doc-impact: <reason>` line (or the
          # follow-up-issue equivalent), not specifically a ticked checkbox, so a body
          # written without the PR template's checkbox scaffolding must still pass.
          python3 - <<'PYEOF'
          import os
          import re
          import sys

          body = os.environ.get("BODY") or ""

          def declared_reason(pattern):
              match = re.search(pattern, body, re.IGNORECASE)
              if not match:
                  return None
              reason = match.group("reason")
              # Anchored to a single line (no re.DOTALL - the reason can never span
              # lines), so an unticked/empty box can't swallow the next body line as
              # its "reason". If the reason is itself only an unterminated comment
              # marker (a placeholder HTML comment wrapped onto a later line), that
              # leaves a stray "<!--" behind after stripping complete comments - treat
              # that the same as no reason at all, not a truthy one.
              reason = re.sub(r"<!--.*?-->", "", reason)
              reason = reason.replace("`", "").strip()
              if not reason or "<!--" in reason or "-->" in reason:
                  return None
              return reason

          no_impact = declared_reason(r"no-doc-impact:`?[^\S\n]*(?P<reason>[^\n]*)")
          followup = declared_reason(
              r"Follow-up issue #\d+[^\S\n]*because:[^\S\n]*(?P<reason>[^\n]*)"
          )
          reason = no_impact or followup

          if reason:
              print(f"Documentation impact declared: {reason}")
              sys.exit(0)

          print("::error::This PR changes source outside docs/**/*.md with no docs update, and")
          print("no 'no-doc-impact: <reason>' or 'Follow-up issue #N because: <reason>' line")
          print("carries a real reason (not just the template's own HTML-comment placeholder).")
          print("See the documentation-impact table in CONTRIBUTING.md.")
          sys.exit(1)
          PYEOF

      - name: Backlog checklist updated on feature PRs
        if: contains(github.event.pull_request.labels.*.name, 'feature')
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          changed_backlog=$(git diff --name-only "origin/$BASE...HEAD" -- 'docs/backlog/**')
          if [ -z "$changed_backlog" ]; then
            echo "::error::This PR is labelled feature but touches nothing under"
            echo "docs/backlog/** - tick the issue's checklist in the same PR that does the work."
            exit 1
          fi
