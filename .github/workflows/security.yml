name: Security

# OpenSSF Scorecard is deliberately NOT wired up here yet. The Scorecard
# GitHub Action needs GitHub Advanced Security to publish results against a
# private repository (this one - security_and_analysis is null via the API,
# confirming Advanced Security isn't enabled), and would otherwise just fail
# on every scheduled run. Add it when the repo goes public per the licence
# decision in README.md, or if Advanced Security is enabled first.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    # Daily, not just on push/PR (NFR-25) - a new advisory against an
    # unchanged dependency should surface on its own, not wait for the next
    # commit.
    - cron: "30 4 * * *"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # See the matching `changes` job in ci.yml for why this triggers on every
  # PR (no paths-ignore on pull_request above) and filters at job level
  # instead - the branch ruleset (F-7, deferred - see repo-configuration.md)
  # will require the `required` job below to actually run on every PR once
  # applied, which a trigger-level path filter would break.
  changes:
    name: Detect changed paths
    # Only meaningful for pull_request - push already has its own paths-ignore
    # above, and schedule has no base ref to diff against and must always run
    # the full daily audit regardless of what last changed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # 'every': see the matching step in ci.yml for why this is
          # required for the negated patterns below to actually exclude.
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!.github/ISSUE_TEMPLATE/**"

  python-audit:
    name: pip-audit (production dependencies)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # --no-dev: audit what ships, not ruff/mypy/pytest. uv export reads the
      # lockfile directly - no `uv sync` needed just to produce this file.
      - name: Export production dependencies
        run: >
          uv export --all-packages --no-dev --no-hashes --no-emit-workspace
          -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit -r requirements-audit.txt --strict

  frontend-audit:
    name: pnpm audit (production dependencies)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (fails on high/critical - NFR-25)
        run: pnpm audit --prod --audit-level=high

  gitleaks:
    name: gitleaks (secret scanning)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks CLI itself is MIT-licensed and free to use. Deliberately
      # NOT using gitleaks/gitleaks-action: as of writing it requires a paid
      # licence key for organisation-owned repositories (aehrc is one) even
      # though the underlying scanner doesn't. Downloaded directly instead,
      # with its published SHA-256 checksum verified before it's ever run.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan git history
        run: ./gitleaks detect --source . --redact -v

  # Branch ruleset (F-7, deferred) will require this job once applied - see
  # the matching job in ci.yml.
  required:
    name: Required (Security)
    if: always()
    needs: [changes, python-audit, frontend-audit, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if a required job failed
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.python-audit.result }}" \
            "${{ needs.frontend-audit.result }}" \
            "${{ needs.gitleaks.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required job did not succeed (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs passed or were correctly skipped."
