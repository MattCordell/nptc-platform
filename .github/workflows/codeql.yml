name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily in addition to per-PR (NFR-25) - a query-pack update surfaces a
    # finding even on a day nobody touches the code, so this is what catches
    # findings on branches with no open PR.
    - cron: "17 3 * * *"
  workflow_dispatch:
    # Runs on every PR again (repo went public 2026-08-06, so per-PR cost is
    # no longer a concern - see the removed upload:never comment below for the
    # matching upload-side change). Keep this for ad-hoc runs against a branch
    # that hasn't opened a PR yet.

concurrency:
  # Scheduled runs get their own group, distinct from push/PR-triggered runs:
  # without this, `github.ref` is refs/heads/main for both a push to main and
  # the daily schedule, so a push cancels an in-flight scheduled scan - and a
  # cancelled run sends no failure email, directly undercutting the severity
  # gate's whole point (issue #87 review). For a pull_request event,
  # `github.ref` is refs/pull/N/merge, which is already distinct per-PR and
  # from refs/heads/main, so two pushes to the same PR still correctly cancel
  # each other and a push to main still gets its own group.
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The analyze step queries the Actions API for workflow-run metadata
      # while processing results (caught by actually running this workflow,
      # not just linting it).
      actions: read
      # Required to upload SARIF results to the code-scanning API (below).
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Python and JS/TS are both interpreted: CodeQL extracts source
        # directly, no autobuild/manual-build step needed (that's only for
        # compiled languages - Java, C++, C#, Go).
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # Uploads to the code-scanning API (default upload behaviour, no
      # `upload:` input needed) now that the repo is public - findings show
      # up in the Security tab and as PR annotations, not just the step
      # summary and artifact below. `output: sarif-results` is kept so those
      # still work unchanged.
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: Summarise findings
        if: always()
        run: python3 scripts/codeql_gate.py summarize sarif-results "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF as a build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          retention-days: 14

      # Everything above this point is advisory-only: nothing exits non-zero on a
      # finding, so a daily unattended scan could produce output nobody is alerted
      # to (issue #87). Gate on severity instead of any finding at all -
      # security-extended on a pre-alpha codebase surfaces plenty of low-severity
      # noise that would otherwise train reviewers to ignore a real failure.
      # Threshold (7.0, CVSS "high") matches the "high/critical" language NFR-25
      # already uses for pip-audit/pnpm audit in security.yml. Both this step and
      # "Summarise findings" above call scripts/codeql_gate.py (unit-tested under
      # scripts/tests/) rather than duplicating SARIF-parsing logic inline.
      - name: Fail on high/critical findings (NFR-25 threshold)
        run: python3 scripts/codeql_gate.py check-severity sarif-results --threshold 7.0
