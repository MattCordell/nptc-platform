name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Daily rather than only on push to main (NFR-25) - a query-pack update
    # surfaces a finding even on a day nobody touches the code, and this repo
    # doesn't run CodeQL per-PR (see below), so this is also the main way
    # findings on in-progress branches get caught before they land.
    - cron: "17 3 * * *"
  workflow_dispatch:
    # Per-PR CodeQL was dropped (2026-08-04) to stop paying its full cost on
    # every push during active development - the daily schedule now covers
    # regular detection. Trigger this manually on a specific branch/PR when
    # you want assurance before merging something security-sensitive.

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The analyze step queries the Actions API for workflow-run metadata
      # while processing results, even with upload disabled below (caught by
      # actually running this workflow, not just linting it).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Python and JS/TS are both interpreted: CodeQL extracts source
        # directly, no autobuild/manual-build step needed (that's only for
        # compiled languages - Java, C++, C#, Go).
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # upload: never - this repo is private without GitHub Advanced
      # Security, so uploading to the code-scanning API fails outright
      # ("Advanced Security must be enabled for this repository to use code
      # scanning" - caught by running this, not by reading the docs). We
      # still get the scan itself; we just report it ourselves below instead
      # of via the Security tab. Switch this to `always` (or drop the input
      # entirely) once Advanced Security is enabled or the repo goes public.
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - name: Summarise findings
        if: always()
        run: |
          set -euo pipefail
          # codeql-action names the file after its own canonical language name,
          # not always the matrix value verbatim (javascript-typescript ->
          # javascript.sarif, caught by checking the real output rather than
          # assuming) - glob for it instead of hardcoding the name.
          sarif_file=$(find sarif-results -maxdepth 1 -name '*.sarif' -print -quit)
          python3 - "$sarif_file" "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json
          import sys

          sarif_path, summary_path = sys.argv[1], sys.argv[2]
          with open(sarif_path, encoding="utf-8") as f:
              sarif = json.load(f)

          results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
          lines = [f"### CodeQL: {len(results)} finding(s) in {sarif_path}", ""]
          for r in results:
              rule = r.get("ruleId", "?")
              text = r.get("message", {}).get("text", "")
              msg = text.splitlines()[0] if text else ""
              loc = r.get("locations", [{}])[0].get("physicalLocation", {})
              path = loc.get("artifactLocation", {}).get("uri", "?")
              line = loc.get("region", {}).get("startLine", "?")
              lines.append(f"- `{rule}` {path}:{line} - {msg}")

          out = "\n".join(lines) + "\n"
          print(out)
          with open(summary_path, "a", encoding="utf-8") as f:
              f.write(out)
          PYEOF

      - name: Upload SARIF as a build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          retention-days: 14

      # Everything above this point is advisory-only: nothing exits non-zero on a
      # finding, so a daily unattended scan could produce output nobody is alerted
      # to (issue #87). Gate on severity instead of any finding at all -
      # security-extended on a pre-alpha codebase surfaces plenty of low-severity
      # noise that would otherwise train reviewers to ignore a real failure.
      # Threshold (7.0, CVSS "high") matches the "high/critical" language NFR-25
      # already uses for pip-audit/pnpm audit in security.yml.
      - name: Fail on high/critical findings (NFR-25 threshold)
        run: |
          set -euo pipefail
          sarif_file=$(find sarif-results -maxdepth 1 -name '*.sarif' -print -quit)
          python3 - "$sarif_file" <<'PYEOF'
          import json
          import sys

          THRESHOLD = 7.0

          with open(sys.argv[1], encoding="utf-8") as f:
              sarif = json.load(f)

          failed = False
          for run in sarif.get("runs", []):
              # Rule metadata (including security-severity) lives on the tool driver
              # for built-in rules and on tool extensions for query-pack rules
              # (security-extended ships as an extension) - both must be checked,
              # not just the driver.
              rules_by_id = {}
              tool = run.get("tool", {})
              for source in [tool.get("driver", {}), *tool.get("extensions", [])]:
                  for rule in source.get("rules", []):
                      rules_by_id[rule["id"]] = rule

              for result in run.get("results", []):
                  rule_id = result.get("ruleId")
                  rule = rules_by_id.get(rule_id, {})
                  severity = rule.get("properties", {}).get("security-severity")
                  if severity is None:
                      continue
                  if float(severity) >= THRESHOLD:
                      text = result.get("message", {}).get("text", "")
                      msg = text.splitlines()[0] if text else ""
                      loc = result.get("locations", [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "?")
                      line = loc.get("region", {}).get("startLine", "?")
                      print(f"::error::{rule_id} (security-severity {severity}) {path}:{line} - {msg}")
                      failed = True

          if failed:
              sys.exit(1)
          PYEOF
