name: Docs

# Runs instead of ci.yml's full Python/Node matrix for a documentation-only PR
# (see ci.yml's paths filtering). A PR that also touches source still gets
# this workflow too, since the jobs below are filtered individually rather
# than at the workflow trigger - see the `changes` job. Deliberately
# triggers on every PR (no `paths:` on pull_request) so that the `required`
# job actually runs on every PR: the branch ruleset (F-7, deferred - see
# repo-configuration.md) will require it once applied, and a trigger-level
# path filter would make GitHub wait forever for a check that never fires on
# a code-only PR.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "scripts/traceability_check.py"
      - "scripts/backlog_sync.py"
      - ".markdownlint-cli2.yaml"
      # Mirrors the `changes` job's `test_trees` filter below (the thing that
      # actually gates `traceability` on a PR) - kept here too so a push to main
      # touching only a test tree still triggers this workflow at all.
      - "backend/tests/**"
      - "transform/tests/**"
      - "shared/tests/**"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      test_trees: ${{ steps.filter.outputs.test_trees }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            docs:
              - "docs/**"
              - "**/*.md"
              - "scripts/traceability_check.py"
              - "scripts/backlog_sync.py"
              - ".markdownlint-cli2.yaml"
            # A separate output, not folded into `docs`: markdownlint and the
            # network-dependent lychee link check have nothing to do with a
            # test-tree-only PR, so gating them on this too would widen
            # Required (Docs)'s flaky-failure surface for no reason - only
            # `traceability` (below) also checks this output.
            test_trees:
              - "backend/tests/**"
              - "transform/tests/**"
              - "shared/tests/**"

  markdownlint:
    name: markdownlint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  link-check:
    name: lychee link check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # mailto: links are excluded by default (opt back in with
          # --include-mail) - caught by running this, since the --exclude-mail
          # flag this action's own docs used to document no longer exists.
          args: >
            --no-progress
            --exclude "^http://localhost"
            --exclude "^https://tx\.ontoserver\.csiro\.au"
            --exclude-path frontend/node_modules
            --exclude-path .venv
            './**/*.md'
          fail: true

  traceability:
    name: Requirements traceability
    needs: changes
    # @pytest.mark.req("FR-nn") markers live in the test trees (see
    # traceability_check.py's TEST_DIRS) - a PR that adds, renames or deletes a
    # marker without touching a doc file must still run this job, or a stale
    # traceability.md goes undetected until some unrelated later docs PR trips
    # over it (issue #87). Keep `test_trees`'s filter list in step with TEST_DIRS.
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.test_trees == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install workspace
        run: uv sync --all-packages --locked

      - name: traceability_check.py
        run: uv run python scripts/traceability_check.py

      # docs/requirements/traceability.md is committed, not gitignored, so it's
      # reviewable in a diff like any other generated-but-tracked artefact -
      # this catches a PR that changed requirements.yaml or a test's
      # @pytest.mark.req without regenerating the report to match.
      - name: traceability.md is up to date
        run: |
          if ! git diff --exit-code -- docs/requirements/traceability.md; then
            echo "::error::docs/requirements/traceability.md is stale - run"
            echo "'uv run python scripts/traceability_check.py' and commit the result."
            exit 1
          fi

  backlog-sync-dry-run:
    name: backlog_sync.py --dry-run
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install workspace
        run: uv sync --all-packages --locked

      # Read-only: validates docs/backlog/*.yaml (schema, requirement IDs, unknown
      # milestones) and prints the plan it would apply, without applying it - a
      # malformed backlog fails review here rather than the real import later.
      - name: backlog_sync.py --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/backlog_sync.py

  # Branch ruleset (F-7, deferred) will require this job once applied - see
  # the matching job in ci.yml.
  required:
    name: Required (Docs)
    if: always()
    needs: [changes, markdownlint, link-check, traceability, backlog-sync-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if a required job failed
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.markdownlint.result }}" \
            "${{ needs.link-check.result }}" \
            "${{ needs.traceability.result }}" \
            "${{ needs.backlog-sync-dry-run.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required job did not succeed (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs passed or were correctly skipped."
