name: Docs

# Runs instead of ci.yml's full Python/Node matrix for a documentation-only PR
# (see ci.yml's paths filtering). A PR that also touches source still gets
# this workflow too, since the jobs below are filtered individually rather
# than at the workflow trigger - see the `changes` job. Deliberately
# triggers on every PR (no `paths:` on pull_request) so that the `required`
# job actually runs on every PR: the branch ruleset (F-7, deferred - see
# repo-configuration.md) will require it once applied, and a trigger-level
# path filter would make GitHub wait forever for a check that never fires on
# a code-only PR.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "scripts/traceability_check.py"
      - ".markdownlint-cli2.yaml"
      # `traceability` runs unconditionally on every PR (no such filter would
      # be complete - see that job's comment) but this workflow's own push
      # trigger is still path-filtered, so a push to main touching only a
      # test tree needs listing here or the workflow would not run at all.
      - "backend/tests/**"
      - "transform/tests/**"
      - "shared/tests/**"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - "docs/**"
              - "**/*.md"
              - "scripts/traceability_check.py"
              - ".markdownlint-cli2.yaml"

  markdownlint:
    name: markdownlint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  link-check:
    name: lychee link check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # mailto: links are excluded by default (opt back in with
          # --include-mail) - caught by running this, since the --exclude-mail
          # flag this action's own docs used to document no longer exists.
          args: >
            --no-progress
            --exclude "^http://localhost"
            --exclude "^https://tx\.ontoserver\.csiro\.au"
            --exclude-path frontend/node_modules
            --exclude-path .venv
            './**/*.md'
          fail: true

  traceability:
    name: Requirements traceability
    # Runs unconditionally, no path filter, no `needs:` on `changes` (nothing
    # here reads its outputs). @pytest.mark.req("FR-nn") markers
    # live in the test trees (see traceability_check.py's TEST_DIRS), so a PR
    # that adds, renames or deletes a marker without touching a doc file must
    # still run this job, or a stale traceability.md goes undetected until
    # some unrelated later docs PR trips over it (issue #87). A requirement's
    # `evidence:` path (ADR-0002) makes this worse, not just wider: it can
    # point anywhere in the repo (e.g. a CI workflow file), so there is no
    # enumerable path filter that covers every file an evidence: pointer might
    # go stale against - a PR that renames or deletes such a file must run
    # this job too, and it is cheap enough that gating it was never worth the
    # risk of a silent gap.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install workspace
        run: uv sync --all-packages --locked

      # Exit code is the actual gate (stale @pytest.mark.req markers or
      # requirements.yaml entries vs. the test suite) - docs/requirements/
      # traceability.md itself is gitignored (issue #126: a generated file
      # that diverged byte-for-byte between branches, causing merge conflicts
      # in a file nobody hand-edits), so it's uploaded below rather than
      # diffed against a committed copy.
      - name: traceability_check.py
        run: uv run python scripts/traceability_check.py

      - name: Upload traceability.md
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traceability-report
          path: docs/requirements/traceability.md
          retention-days: 30
          # traceability_check.py can raise before writing the report (e.g. a
          # malformed requirements.yaml - yaml.safe_load throws in
          # load_requirements) - don't add an upload-artifact warning on top
          # of that real failure.
          if-no-files-found: ignore

  # Branch ruleset (F-7, deferred) will require this job once applied - see
  # the matching job in ci.yml.
  required:
    name: Required (Docs)
    if: always()
    needs: [changes, markdownlint, link-check, traceability]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if a required job failed
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.markdownlint.result }}" \
            "${{ needs.link-check.result }}" \
            "${{ needs.traceability.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required job did not succeed (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs passed or were correctly skipped."
