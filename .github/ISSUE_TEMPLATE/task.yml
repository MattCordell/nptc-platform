name: Backlog task
description: >-
  A unit of implementation work. This is the standard way to open one — the issue
  itself, not a YAML file, is the source of truth for what it covers and which of
  its checklist boxes are ticked.
# No default label - set the native Issue Type (usually "Feature" or "Task") in
# the form sidebar instead.
body:
  - type: markdown
    attributes:
      value: |
        Fill in a checklist as part of "Acceptance criteria" below and tick its boxes
        directly on this issue as work completes — don't track progress anywhere else.
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      description: "e.g. FR-25, FR-26. Leave blank only for pure chores/tooling."
      placeholder: FR-nn, NFR-nn
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - Foundation
        - "P0 — Seeding transform"
        - "P1 — Core catalogue"
        - "P2 — Contribution"
        - "P3 — Validation"
        - "P4 — Release and export"
        - "P5 — Hardening"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What needs to be done, and why
      description: One or two paragraphs. Cite the PRD section if there is one.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete and testable, one per line.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation impact
      description: >-
        Which documents this touches (see the table in CONTRIBUTING.md), or "none" with
        a one-line reason.
    validations:
      required: true
