version: 2

updates:
  # Backend, transform and shared share one uv workspace and one uv.lock at
  # the repository root (see ADR-0001) - a single "uv" entry covers all three.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["area/infra", "dependencies"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["area/frontend", "dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["area/ci", "dependencies"]

  # Placeholder: no Dockerfile exists yet (deploy/ and its container images
  # land with Foundation issue F-7 and phase P4/P5). Directory is a
  # provisional guess and MUST be corrected in whichever PR adds the first
  # Dockerfile, alongside converting this comment into a real entry if the
  # eventual layout differs (e.g. per-service Dockerfiles under backend/,
  # frontend/ rather than a shared deploy/ directory).
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["area/infra", "dependencies"]
