version: 2

updates:
  # Backend, transform and shared share one uv workspace and one uv.lock at
  # the repository root (see ADR-0001) - a single "uv" entry covers all three.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["infra", "dependencies"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["frontend", "dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["ci", "dependencies"]

  # Tracks image tags in deploy/compose.yml (Foundation issue F-7). No
  # Dockerfile of our own exists yet - that lands with the backend/frontend
  # container images in P4/P5 - but Dependabot's docker ecosystem also scans
  # compose files in this directory for base image updates.
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["infra", "dependencies"]
