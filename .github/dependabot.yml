version: 2

updates:
  # Backend, transform and shared share one uv workspace and one uv.lock at
  # the repository root (see ADR-0001) - a single "uv" entry covers all three.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["infra", "dependencies"]

  # Directory is the repository root, not /frontend, even though frontend/ is
  # the only package: pnpm-workspace.yaml and pnpm-lock.yaml both live here and
  # Dependabot must run where the lockfile is. From the root it runs `pnpm
  # recursive update`, which rewrites the member manifests AND the shared
  # lockfile; pointed at /frontend it found a package.json with no lockfile
  # beside it and updated the manifest alone, so every PR it opened failed
  # `pnpm install --frozen-lockfile` in CI (dependabot-core#11135, and #11487
  # which made "update a pnpm workspace from a subdirectory" an explicit
  # misconfiguration). Do not "tidy" this back to /frontend.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
      # Majors grouped too, unlike the other ecosystems. The frontend toolchain
      # is peer-entangled - vite pins @vitejs/plugin-react, vitest pins vite,
      # eslint pins @eslint/js and every plugin - so Dependabot's default of one
      # PR per major produces a set of PRs that each fail on the others' absence.
      npm-major:
        update-types: ["major"]
    ignore:
      # typescript-eslint cannot lint TS 7: TS 7 is the Go port (tsgo) and does not
      # expose the legacy compiler API typescript-eslint reads, and the likely bridge
      # is async, which ESLint does not support for parsers. Its peer range is
      # `>=4.8.4 <6.1.0`. Dependabot raised this major three times (#94, #120, #170)
      # and each failed CI identically. Revisit when typescript-eslint#10940 ships;
      # remove this entry then. TS 6.x minors/patches are deliberately NOT ignored.
      - dependency-name: "typescript"
        versions: [">=7"]
    labels: ["frontend", "dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["ci", "dependencies"]

  # Tracks the postgres and keycloak image tags in deploy/compose.yml
  # (Foundation issue F-7). "docker-compose", not "docker": the docker
  # ecosystem reads Dockerfiles and Kubernetes manifests only and failed every
  # run here with `dependency_file_not_found: No Dockerfiles nor Kubernetes
  # YAML found in /deploy`. Compose files are a separate ecosystem, GA since
  # February 2025. Add a "docker" entry alongside this one when our own
  # Dockerfiles land with the backend/frontend container images in P4/P5.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["infra", "dependencies"]
