[project]
name = "nptc-backend"
version = "0.0.0"
description = "NPTC Catalogue Maintenance Platform - API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.3.4",
    "nptc-shared",
    # The floor is not arbitrary: before 2.13, PyJWKClient.fetch_data wrote
    # its result in a `finally:` block, so a failed fetch cached `None` and
    # wiped a perfectly good JWKS (GHSA-fhv5-28vv-h8m8) - precisely the
    # failure issue #43's acceptance criterion 4 exists to rule out. Do not
    # relax this floor.
    "pyjwt[crypto]>=2.13",
    # The backend now imports httpx directly for OIDC discovery (issue
    # #43); previously only transitive via nptc-shared.
    "httpx>=0.28",
]

[tool.uv.sources]
nptc-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nptc"]
