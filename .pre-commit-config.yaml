# Fast, local checks that run before every commit. CI (F-2) re-runs the
# authoritative, slower versions of these (full mypy, full test suite,
# integration tests) - pre-commit exists to catch mistakes before they reach a
# PR, not to replace CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # SPIA export cells must never carry trailing whitespace (FR-63,
        # NFR-38.2) - fixtures under transform/tests/fixtures/ are the one
        # deliberate exception, since some encode the very defect being tested.
        exclude: ^transform/tests/fixtures/
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # PowerShell scripts are CRLF by convention (see .gitattributes /
        # CONTRIBUTING.md); everything else in the repo is LF.
        exclude: \.(ps1|psm1)$
      - id: detect-private-key

  - repo: local
    hooks:
      # Ruff runs through the workspace environment, not a pinned
      # astral-sh/ruff-pre-commit mirror - same reason as mypy below. A second
      # pinned ruff drifts from the one uv.lock resolves (issue #339: the mirror
      # sat at v0.16.1 while uv.lock held 0.16.8, itself below pyproject.toml's
      # own `ruff>=0.16.2` floor), and the disagreement surfaces only as a CI
      # failure after a push, since Dependabot has no `pre-commit` ecosystem to
      # keep the rev in step. One resolved version means no drift to detect.
      # scripts/tests/test_precommit_config.py guards this - do not "tidy" the
      # mirror back in.
      - id: ruff
        name: ruff check --fix (uv run)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format (uv run)
        entry: uv run ruff format
        language: system
        types: [python]

      # mypy needs the workspace's own resolved environment (SQLAlchemy /
      # Pydantic plugins, first-party packages), which the pre-commit-managed
      # mirror hooks don't have easy access to - run it via uv instead.
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: migration-docstring-placeholder
        name: no unfilled migration docstring placeholder (uv run)
        entry: uv run python scripts/migration_placeholder_check.py
        language: system
        files: ^backend/migrations/versions/.*\.py$

      - id: openapi-document-is-current
        name: docs/api/openapi.json is up to date (uv run)
        entry: uv run python scripts/generate_openapi.py --check
        language: system
        # Matches openapi.yml's CI filter, not just nptc.api: a response
        # model can reference a type from anywhere in backend/src (e.g.
        # catalogue/, registry/) or from nptc_shared, and a narrower scope
        # here would let such a change pass pre-commit and only fail in CI.
        files: ^(backend/src/.*\.py|shared/src/.*\.py|docs/api/openapi\.json)$
        pass_filenames: false

      - id: generated-api-client-is-current
        name: frontend/src/api/schema.ts is up to date (pnpm)
        # Regenerates into a `mktemp` file rather than in place or a fixed
        # `/tmp` path, so the hook never mutates a file the commit didn't
        # touch, and two concurrent runs (two clones, a parallel
        # `pre-commit run`) don't race on the same path. `set -e` plus a
        # separate generate step keeps a genuine failure there (a missing
        # corepack, a malformed openapi.json) from being swallowed into the
        # "stale" message below - that message fires only for an actual
        # diff. `diff` (no `-q`) so the author sees what differs, not just
        # that something does.
        entry: |-
          bash -c 'set -e
          cd frontend
          tmp=$(mktemp)
          trap '\''rm -f "$tmp"'\'' EXIT
          corepack pnpm exec openapi-typescript ../docs/api/openapi.json -o "$tmp"
          if ! diff "$tmp" src/api/schema.ts; then
            echo "frontend/src/api/schema.ts is stale - regenerate it with: pnpm --filter nptc-frontend generate:api" >&2
            exit 1
          fi'
        language: system
        files: ^(docs/api/openapi\.json|frontend/src/api/.*)$
        pass_filenames: false

      - id: frontend-lint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && corepack pnpm exec eslint .'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-format
        name: prettier --check (frontend)
        entry: bash -c 'cd frontend && corepack pnpm exec prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
