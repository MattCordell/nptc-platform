# markdownlint-cli2 config (docs.yml, Foundation issue F-5).
config:
  default: true
  MD013: false # line length - prose docs here aren't hard-wrapped
  MD029: false # ordered-list-prefix - CONTRIBUTING.md continues one logical
  #              numbered list (1-8) across an explanatory paragraph break
  MD033: false # inline HTML - used sparingly in a few docs
  MD034: false # bare URLs - plain email/URL mentions are fine as-is
  MD041: false # first line must be a top-level heading - not every doc starts with one
  MD060: false # table column pipe-spacing style - not worth enforcing across hand-written tables

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - ".venv/**"
  - "**/.venv/**"
  # The PRD moved here unmodified (see its own PR) and stays that way - it is
  # a snapshot of the source document, not a living doc this repo edits.
  - "docs/prd/**"
